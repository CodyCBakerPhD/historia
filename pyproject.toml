[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/historia"]



[project]
name = "historia"
version = "0.14.1"
authors = [
  { name="Cody Baker", email="cody.c.baker.phd@gmail.com" },
]
description = "Collects GitHub activity for use in project dashboards."
readme = "README.md"
keywords = [
    "GitHub",
    "work history",
    "data collection",
    "project management",
]
license = {file = "LICENSE.txt"}
requires-python = ">=3.10"
dependencies = [
    "beartype",
    "requests",
    "tqdm",
    "rich-click",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
historia = "historia._cli:historia_cli"

[dependency-groups]
dev = [
    "pytest",
    "pre-commit",
    "ipython",
    "sybil",
]
docs = [
    "sphinx>=8.0",
    "pydata-sphinx-theme>=0.16",
    "myst-parser>=4.0",
    "sphinx-tabs>=3.4",
    "sphinx-copybutton>=0.5",
]



[tool.black]
line-length = 120
target-version = ['py310']

[tool.ruff]
extend-exclude = [
  "*/__init__.py",
]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Copyright headers are not added yet
    "CPY001",
    # Docstring style: prefer the D213 / D211 conventions
    "D203",
    "D212",
    # Common HTTP status codes (200, 403, ...) and other small integer
    # literals are clearer inline than as named module-level constants
    "PLR2004",
    # GraphQL uses exceeds the branch / complexity / statement thresholds; unavoidable
    "C901",
    "PLR0912",
    "PLR0915",
    # Fine to use Unicode characters
    "RUF003",
    # `tests/` and `docs/` are deliberately not Python packages
    "INP001",
    # We use relative imports within the package (see developer guide)
    "TID252",
]
# The docstring-to-code checks (pydoclint) are still preview rules, so preview is on but only
# rules named by their exact code are selected from it. DOC502 is left off so that a docstring
# may document an exception raised by a helper the function calls.
preview = true
explicit-preview-rules = true
extend-select = ["DOC201", "DOC202", "DOC402", "DOC403", "DOC501"]
fixable = ["ALL"]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.per-file-ignores]
# `docs/conf.py` is the Sphinx configuration entry point: `copyright` is the
# Sphinx-required variable name (shadows a builtin) and the file does not
# require its own module docstring
"docs/conf.py" = ["A001", "D100"]
# Tests rely on `assert` (S101), commonly access private members (SLF001),
# omit per-module/per-function docstrings (D100, D103), and reference
# predictable temp paths in fixtures (S108)
"tests/**/*.py" = [
    "S101",
    "S108",
    "SLF001",
    "D100",
    "D103",
    "FBT001",
]

[tool.pytest.ini_options]
testpaths = ["tests", "docs/tutorial"]
markers = [
    "ai_generated: mark test as AI-generated",
    "remote: mark test as requiring live remote services",
]

[tool.ruff.lint.isort]
relative-imports-order = "closest-to-furthest"
known-first-party = ["historia"]

[tool.numpydoc_validation]
checks = [
    "all",
    # Examples, See Also, and an extended summary are not expected on every object
    "EX01",
    "SA01",
    "ES01",
    # Docstrings end with a blank line before the closing quotes, which ruff's D413 asks for
    "GL02",
    "GL03",
]
# Names with a leading underscore are not part of the documented API
exclude = ['\._\w+$']

[tool.mypy]
python_version = "3.10"
files = ["src/historia"]
