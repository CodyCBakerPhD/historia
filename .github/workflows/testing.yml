name: Testing

on:
  workflow_call:
    inputs:
      marks:
        description: "Pytest mark expression passed to -m (e.g. 'not remote' or 'remote'). Omit to run all tests"
        type: string
        required: false

env:
  GITHUB_TOKEN: ${{ secrets._GITHUB_API_KEY }}

# Every run that reaches GitHub shares one token, and overlapping runs trip GitHub's secondary rate limit.
# The group lives here rather than on the calling jobs, where a finished run was reported as cancelled.
concurrency:
  group: ${{ inputs.marks == 'not remote' && format('offline-tests-{0}', github.run_id) || 'remote-tests' }}
  cancel-in-progress: false

jobs:
  Testing:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13

      - name: Install
        run: pip install -e . --group dev pytest-cov

      - name: Run tests
        run: pytest ${MARKS:+-m "$MARKS"} --cov=src/historia --cov-report=xml
        env:
          MARKS: ${{ inputs.marks }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
