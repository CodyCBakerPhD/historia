name: Move the action major tag

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build and upload latest release Docker image to GHCR]
    types: [completed]

jobs:
  move-tag:
    name: Point v0 at the newest release
    # `v0` may only ever name a release whose container image is already on GHCR, so this waits for the
    # image workflow rather than for the release itself.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve latest release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          if [ -z "${release_tag}" ]; then
            echo "Could not resolve latest release tag." >&2
            exit 1
          fi
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Move v0 to the release commit
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          major="v${RELEASE_TAG#v}"
          major="${major%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force --annotate "${major}" "${RELEASE_TAG}^{commit}" --message "Newest ${major} release: ${RELEASE_TAG}"
          git push --force origin "refs/tags/${major}"
