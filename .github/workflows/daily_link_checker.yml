name: Daily link checker

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  LinkChecker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --timeout 30
            --max-retries 5
            --retry-wait-time 5
            --exclude '^https://github\.com/CodyCBakerPhD/historia/blob/[^/]+/src/.+#L\d+(-L\d+)?$'
            --exclude '^https://api\.github\.com/graphql$'
            --exclude '^https://api\.github\.com/user/repos$'
            --exclude '^https://api\.github\.com/(users|orgs)/(%7Bowner%7D|\{owner\})$'
            --exclude '^https://github\.com/((users|orgs)/)?(%7Blogin%7D|\{login\})/projects/(%7Bnumber%7D|\{number\})$'
            --exclude '^https://github\.com/[^/]+/projects/\d+/?$'
            --exclude '^https://github\.com/(users|orgs)/[^/]+/projects/\d+/?$'
            --exclude '^https://github\.com/owner/repo/(issues|pull)/\d+$'
            --exclude '^https://x-access-token/$'
            --exclude '^https://pypi\.org/pypi/(%7Bpackage_name%7D|\{package_name\})(/(%7Bversion%7D|\{version\}))?/json$'
            --exclude '^https://github\.com/\$REPO_FULL_NAME\.git$'
            --exclude '^https://github\.com/\$REPO_OWNER_TYPE/\$REPO_OWNER/projects/\$PROJECT_NUMBER$'
            --exclude '^https://github\.com/(octocat|my-org)/work-history-data(-prev)?(/actions/workflows/update\.yml)?$'
            '**/*.md'
            '**/*.rst'
            '**/*.py'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  NotifyOnFailure:
    runs-on: ubuntu-latest
    permissions: {}
    needs: [LinkChecker]
    if: ${{ always() && needs.LinkChecker.result == 'failure' }}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: Historia Daily Link Checker"
          to: cody.c.baker.phd@gmail.com
          from: Historia <historia@users.noreply.github.com>
          body: "The daily link checker workflow failed, please check status at https://github.com/CodyCBakerPhD/historia/actions/workflows/daily_link_checker.yml"
