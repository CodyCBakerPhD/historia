name: Release to PyPI

# Only `release: published`. Publishing a release also creates its tag, so a `push: tags` trigger
# fired a second run of this workflow that an `if: github.event_name == 'release'` guard existed
# only to skip. That skipped run still counts as completed, so it woke the image workflow through
# `workflow_run` for it to skip in turn. Two dead rows per release, and no trigger left to guard.
on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
