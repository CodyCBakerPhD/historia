name: Prepare release draft

# A release cut by hand asks for a tag name, and the answer is already in the repository: the
# version in `pyproject.toml`. Typing it again is where `v0.10.15` came to be cut on a tree bumped
# to `0.10.16`, shipping action files that referenced a version which was never released.
#
# This keeps a draft release whose tag name and target are taken from the repository, so releasing
# is opening the prepared draft and pressing Publish. The tag is created from the stored name, so
# there is nothing left to mistype. Nothing here can stop a release typed in by hand instead, but
# it removes the reason to type one.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the version this commit would release as
        id: resolve
        run: |
          VERSION=$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "This commit would release as v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip when that version is already released
        id: released
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG is already tagged, so there is nothing to prepare." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the draft
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          # The notes are whatever `## Upcoming` currently holds, so the draft always shows what
          # this release would contain.
          NOTES=$(awk '/^## Upcoming$/ {found = 1; next} /^## / {found = 0} found' CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="No entries under \`## Upcoming\` yet."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
            echo "Updated the existing draft for $TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
            echo "Created a draft for $TAG." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Rename \`## Upcoming\` to \`## $TAG\` in CHANGELOG.md before publishing it." >> "$GITHUB_STEP_SUMMARY"
